<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChartNexus · COSUI</title>
  </head>
  <body>
    <main style="max-width: 1000px; margin: 40px auto; font-family: system-ui">
      <h1>ChartNexus × COSUI Dynamic UI</h1>
      <p>Real San + Cosmic Dynamic UI host</p>
      <div>
        <button id="intent">Intent</button> <button id="native">Native</button>
        <button id="invalid">Invalid</button>
        <button id="partial">Partial document</button>
        <button id="remove">Remove</button>
      </div>
      <section
        id="cosui-chart"
        style="min-height: 320px; border: 1px solid #ccd5df"
      ></section>
      <h2>Diagnostics</h2>
      <pre id="cosui-status"></pre>
      <h2>Selection</h2>
      <pre id="cosui-event"></pre>
    </main>
    <script type="module" src="/cosui.ts"></script>
  </body>
</html>
